<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <title>PresentCraft - Control Center</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/panes.css" />
  <link rel="stylesheet" href="css/bottom.css" />
  <link rel="stylesheet" href="css/editor.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
  <div id="app">
    <nav id="menubar"></nav>

    <main id="workspace">
      <!-- ================= LIBRARY (media) ================= -->
      <aside id="library">
        <div class="ex-head">
          <span>Media</span><span id="lib-count"></span>
          <span class="sp"></span>
          <button class="ex-act" id="lib-new" title="Grup baru" aria-label="Grup baru">
            <svg viewBox="0 0 16 16">
              <path d="M1 3h5l1.5 1.5H15V13H1z" />
            </svg>
          </button>
          <button class="ex-act" id="lib-add" title="Tambah file ke grup terpilih…" aria-label="Tambah file">
            <svg viewBox="0 0 16 16">
              <path d="M7.5 2h1v5.5H14v1H8.5V14h-1V8.5H2v-1h5.5z" />
            </svg>
          </button>
          <button class="ex-act" id="lib-sort" title="Urutkan grup terpilih" aria-label="Urutkan">
            <svg viewBox="0 0 16 16">
              <path d="M2 3.5h12V5H2zM2 7.25h8.5v1.5H2zM2 11h5v1.5H2z" />
            </svg>
          </button>
          <button class="ex-act" id="lib-del" title="Hapus grup / item terpilih (Del)" aria-label="Hapus">
            <svg viewBox="0 0 16 16">
              <path d="M5 1h6v1.5h3.5V4h-13V2.5H5zM3 5h10l-.7 9.5H3.7z" />
            </svg>
          </button>
        </div>
        <div id="lib-list" tabindex="0"></div>
      </aside>

      <!-- ================= SLIDE SORTER ================= -->
      <section id="sorter">
        <div class="pane-title">
          <span>Slide</span>
          <span id="slide-count"></span>
          <span class="sp"></span>

          <button class="clear-btn" id="tb-edit" title="Edit slide (Enter)" aria-label="Edit slide">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <path d="M11 2.5l2.5 2.5L5.5 13H3v-2.5z" />
              <path d="M9.5 4l2.5 2.5" />
            </svg>
          </button>

          <button class="clear-btn" id="tb-blank" aria-pressed="false" title="Show / hide audience screen (B)"
            aria-label="Show or hide audience screen">
            <svg class="eye-open" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 8s2.6-4.5 7-4.5S15 8 15 8s-2.6 4.5-7 4.5S1 8 1 8z" />
              <circle cx="8" cy="8" r="2" />
            </svg>
            <svg class="eye-closed" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1.5 6.5C3.2 9.2 5.5 10.5 8 10.5s4.8-1.3 6.5-4" />
              <path d="M3.6 9.3L2.4 11M8 10.5v2M12.4 9.3l1.2 1.7" />
            </svg>
          </button>

          <span class="pane-sep"></span>

          <div class="zoom-ctl">
            <span class="zoom-lbl">Slide Size</span>
            <button class="zoom-btn" id="zoom-out" title="Zoom out" aria-label="Zoom out">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                aria-hidden="true">
                <path d="M3.5 8h9" />
              </svg>
            </button>
            <input type="range" id="zoom" min="120" max="380" value="200" aria-label="Ukuran thumbnail" />
            <button class="zoom-btn" id="zoom-in" title="Zoom in" aria-label="Zoom in">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                aria-hidden="true">
                <path d="M3.5 8h9M8 3.5v9" />
              </svg>
            </button>
          </div>
        </div>

        <div id="warn-slot"></div>
        <div id="slide-grid"></div>
      </section>

      <!-- ================= PROPERTIES ================= -->
      <aside id="props">
        <div class="pane-title">Properties</div>
        <div id="props-scroll">
          <p class="muted" id="props-empty">Select a slide.</p>

          <div class="body" id="props-body" hidden>
            <div class="ed-grid">
              <div class="ed-f s2">
                <label class="ed-fl" for="p-rotation">Rotasi</label>
                <input type="number" id="p-rotation" step="0.1" />
              </div>

              <div class="ed-f s2">
                <label class="ed-fl" for="p-opacity">Opacity</label>
                <div style="display:flex;gap:6px;align-items:center">
                  <input type="range" id="p-opacity" min="0" max="1" step="0.01" />
                  <span id="p-opacity-v" style="width:36px;text-align:right"></span>
                </div>
              </div>

              <div class="ed-f s2">
                <span class="ed-fl">Align</span>
                <div class="ed-seg">
                  <button type="button" data-ralign="Left" title="Left-aligned" aria-label="Left-aligned">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
                      stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M2 1.5V14.5" />
                      <rect x="4" y="4" width="9" height="3" />
                      <rect x="4" y="9" width="6" height="3" />
                    </svg>
                  </button>
                  <button type="button" data-ralign="center" title="Horizontal-center" aria-label="Horizontal-center">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
                      stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M8 1.5V14.5" />
                      <rect x="3" y="4" width="10" height="3" />
                      <rect x="5" y="9" width="6" height="3" />
                    </svg>
                  </button>
                  <button type="button" data-ralign="Right" title="Right-aligned" aria-label="Right-aligned">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
                      stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M14 1.5V14.5" />
                      <rect x="3" y="4" width="9" height="3" />
                      <rect x="6" y="9" width="6" height="3" />
                    </svg>
                  </button>
                  <button type="button" data-ralign="Top" title="Top-aligned" aria-label="Top-aligned">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
                      stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M1.5 2H14.5" />
                      <rect x="4" y="4" width="3" height="9" />
                      <rect x="9" y="4" width="3" height="6" />
                    </svg>
                  </button>
                  <button type="button" data-ralign="middle" title="Vertical-center" aria-label="Vertical-center">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
                      stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M1.5 8H14.5" />
                      <rect x="4" y="3" width="3" height="10" />
                      <rect x="9" y="5" width="3" height="6" />
                    </svg>
                  </button>
                  <button type="button" data-ralign="Bottom" title="Bottom-aligned" aria-label="Bottom-aligned">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
                      stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M1.5 14H14.5" />
                      <rect x="4" y="3" width="3" height="9" />
                      <rect x="9" y="6" width="3" height="6" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div id="preview">
            <div class="pv-title">Preview</div>
            <div id="pv-host" class="thumb" hidden></div>
            <p class="muted" id="pv-empty" style="padding: 0">Select a slide.</p>
            <div class="pv-seekrow">
              <input type="range" id="pv-seek" min="0" max="1000" value="0" aria-label="Posisi video" />
              <span id="pv-time">0:00 / 0:00</span>
            </div>
            <div class="pv-controls">
              <button class="pv-btn" id="pv-restart" title="Ulang dari awal" aria-label="Ulang dari awal"></button>
              <button class="pv-btn pill" id="pv-back" title="Mundur 5 detik">−5s</button>
              <button class="pv-btn primary" id="pv-toggle" title="Putar / Jeda (klik preview juga bisa)"
                aria-label="Putar / Jeda"></button>
              <button class="pv-btn pill" id="pv-fwd" title="Maju 5 detik">+5s</button>
              <button class="pv-btn" id="pv-loop" title="Ulang terus (loop)" aria-label="Loop"></button>
              <button class="pv-btn pill" id="pv-speed" title="Kecepatan putar">1×</button>
            </div>
          </div>
        </div>
      </aside>
    </main>

    <!-- ================= TOOLBAR (Bible only, kept separate) ================= -->
    <div id="toolbar">
      <div class="tb-group" id="tb-grp-bible">
        <button class="tb" id="tb-bible" title="Alkitab" aria-label="Alkitab">
          <i class="fa-solid fa-book-bible"></i>
        </button>
      </div>
      <span class="sp"></span>
      <span id="tb-status"></span>
    </div>

    <!-- ================= BACKGROUND PANEL ================= -->
    <div id="media-panel">
      <!-- left: background group list (explorer style) -->
      <section id="bg-explorer">
        <div class="ex-head">
          <span>Background</span><span id="ex-count"></span>
          <span class="sp"></span>
          <button class="ex-act" id="ex-new" title="Grup baru" aria-label="Grup baru">
            <svg viewBox="0 0 16 16">
              <path d="M1 3h5l1.5 1.5H15V13H1z" />
            </svg>
          </button>
          <button class="ex-act" id="ex-add-file" title="Tambah file ke grup terpilih…" aria-label="Tambah file">
            <svg viewBox="0 0 16 16">
              <path d="M7.5 2h1v5.5H14v1H8.5V14h-1V8.5H2v-1h5.5z" />
            </svg>
          </button>
          <button class="ex-act" id="ex-sort" title="Urutkan grup terpilih" aria-label="Urutkan">
            <svg viewBox="0 0 16 16">
              <path d="M2 3.5h12V5H2zM2 7.25h8.5v1.5H2zM2 11h5v1.5H2z" />
            </svg>
          </button>
          <button class="ex-act" id="ex-delete" title="Hapus grup / item terpilih (Del)" aria-label="Hapus">
            <svg viewBox="0 0 16 16">
              <path d="M5 1h6v1.5h3.5V4h-13V2.5H5zM3 5h10l-.7 9.5H3.7z" />
            </svg>
          </button>
        </div>
        <div id="ex-list" tabindex="0"></div>
      </section>

      <!-- right: slide background area -->
      <section id="bg-detail">
        <div class="pane-title">
          <span>Slide Background</span>
          <span class="sp"></span>

          <button class="clear-btn" id="bg-toggle" aria-pressed="false"
            title="Click: show / hide background. Right-click: remove background"
            aria-label="Show or hide background">
            <svg class="eye-open" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 8s2.6-4.5 7-4.5S15 8 15 8s-2.6 4.5-7 4.5S1 8 1 8z" />
              <circle cx="8" cy="8" r="2" />
            </svg>
            <svg class="eye-closed" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1.5 6.5C3.2 9.2 5.5 10.5 8 10.5s4.8-1.3 6.5-4" />
              <path d="M3.6 9.3L2.4 11M8 10.5v2M12.4 9.3l1.2 1.7" />
            </svg>
          </button>

          <span class="pane-sep"></span>

          <div class="zoom-ctl">
            <span class="zoom-lbl">Slide Size</span>
            <button class="zoom-btn" id="bg-zoom-out" title="Zoom out" aria-label="Zoom out">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                aria-hidden="true">
                <path d="M3.5 8h9" />
              </svg>
            </button>
            <input type="range" id="bg-zoom" min="100" max="300" value="160"
              aria-label="Background thumbnail size" />
            <button class="zoom-btn" id="bg-zoom-in" title="Zoom in" aria-label="Zoom in">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                aria-hidden="true">
                <path d="M3.5 8h9M8 3.5v9" />
              </svg>
            </button>
          </div>
        </div>

        <div id="bg-slides" tabindex="0">
          <div id="bg-grid" hidden></div>
          <div id="bg-drop" role="button" tabindex="0">
            <svg viewBox="0 0 24 24">
              <path
                d="M19 15v4H5v-4H3v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4zM11 4.8L7.4 8.4 6 7l6-6 6 6-1.4 1.4L13 4.8V16h-2z"
                transform="translate(0 1)" />
            </svg>
            <b>Seret file ke sini</b>
            <span>atau klik untuk upload (video / gambar)</span>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- hidden native color picker, used by the background right-click menu -->
  <input type="color" id="bg-color" value="#000000"
    style="position:fixed;left:-9999px;opacity:0;pointer-events:none" tabindex="-1" aria-hidden="true" />

  <script src="slide-renderer.js"></script>
  <script type="module" src="js/main.js"></script>
</body>

</html>
