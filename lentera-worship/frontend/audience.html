<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <title>Lentera Worship - Audience Display</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: none;
    }

    #bg-layer {
      position: absolute;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      transform-origin: 0 0;
    }

    #stage {
      position: absolute;
      z-index: 1;
    }
  </style>
</head>

<body>
  <div id="bg-layer"></div>
  <div id="stage"></div>

  <script src="shared/input-player.js"></script>
  <script src="shared/audio-engine.js"></script>
  <script src="shared/cam-source.js"></script>
  <script src="shared/slide-renderer.js"></script>
  <script src="shared/message-renderer.js"></script>
  <script src="shared/message-overlay.js"></script>
  <script type="module">
    import {
      loadBackground,
      onBackgroundChange,
      onBackgroundVisible,
    } from './shared/background-state.js';
    import { onTransition, getTransition } from './shared/transition-state.js';
    import { loadOutput } from './shared/output-state.js';

    await onTransition(() => { });

    const T = getTransition;
    const SR = window.SlideRenderer;
    const { renderSlide, fitStage, renderBackground } = SR;
    const stage = document.getElementById('stage');
    const layer = document.getElementById('bg-layer');

    let out = loadOutput();
    SR.setOutput(out.w, out.h);

    function layoutBg() {
      const s = Math.min(window.innerWidth / out.w, window.innerHeight / out.h);
      Object.assign(layer.style, {
        width: out.w + 'px',
        height: out.h + 'px',
        left: (window.innerWidth - out.w * s) / 2 + 'px',
        top: (window.innerHeight - out.h * s) / 2 + 'px',
        transform: `scale(${s})`,
      });
    }
    layoutBg();

    let lastPayload = { width: 1366, height: 768, layers: [] };
    renderSlide(stage, lastPayload);
    window.addEventListener('resize', () => {
      fitStage(stage);
      layoutBg();
    });



    await window.__TAURI__.event.listen('update-slide-event', (e) => {
      lastPayload = e.payload;
      renderSlide(stage, lastPayload);
    });

    // Ukuran output diganti dari Settings: render ulang slide yang sedang tampil.
    await window.__TAURI__.event.listen('output-changed', (e) => {
      out = { w: e.payload.w, h: e.payload.h };
      SR.setOutput(out.w, out.h);
      layoutBg();
      renderSlide(stage, lastPayload);
    });

    SR.setTransition(getTransition());
    onTransition((t) => SR.setTransition(t));

    await onBackgroundVisible((v) => {
      layer.style.visibility = v ? '' : 'hidden';
    });

    let gotEvent = false;
    await onBackgroundChange((bg) => {
      gotEvent = true;
      renderBackground(layer, bg);
    });
    const saved = await loadBackground();
    if (!gotEvent) renderBackground(layer, saved);
    await window.__TAURI__.event.emit('audience-ready');

    window.addEventListener('keydown', async (e) => {
      if (e.key !== 'F11') return;
      e.preventDefault();
      const w = window.__TAURI__.window.getCurrentWindow();
      await w.setFullscreen(!(await w.isFullscreen()));
    });
  </script>
</body>

</html>
