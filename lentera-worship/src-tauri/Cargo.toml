[package]
name = "lentera-worship"
version = "0.1.1"
description = "Presentation software for song lyrics, Bible verses, and worship slides"
authors = ["Kornelius"]
license = ""
repository = "https://github.com/Kornelius1/Sousou"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
prost-build = "0.13"
protoc-bin-vendored = "3"

[features]
default = []
ndi = ["dep:grafton-ndi"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
prost-reflect = "0.14"
grafton-ndi = { version = "0.9", optional = true }
uuid = { version = "1", features = ["v4"] }
natord = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
nokhwa = { version = "0.10", features = ["input-native"] }
axum = "0.7"
tokio = { version = "1", features = ["net", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
bytes = "1"
jpeg-encoder = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
httpmock = "0.7"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

