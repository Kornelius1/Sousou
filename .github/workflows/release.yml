name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches versions
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG.TrimStart('v')
          $tauri = (Get-Content lentera-worship/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $npm = (Get-Content lentera-worship/package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path lentera-worship/src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $bad = @($tauri, $npm, $cargo) | Where-Object { $_ -ne $tag }
          if ($bad) { throw "Version mismatch: tag=$tag tauri=$tauri npm=$npm cargo=$cargo" }

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: lentera-worship/src-tauri

      - run: cargo install tauri-cli --version "=2.12.4" --locked

      - name: Fetch and decrypt NDI SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.NDI_REPO_TOKEN }}
          NDI_PASSPHRASE: ${{ secrets.NDI_DLL_PASSPHRASE }}
        run: |
          if ([string]::IsNullOrEmpty($env:NDI_PASSPHRASE)) { throw "NDI_DLL_PASSPHRASE is empty" }
          $env:PATH += ";C:\Program Files\Git\usr\bin"

          gh release download ndi-sdk-v1 --repo Kornelius1/lentera-private `
            --pattern "*.gpg" --dir $env:RUNNER_TEMP --clobber
          if ($LASTEXITCODE -ne 0) { throw "Download failed" }

          $pf = Join-Path $env:RUNNER_TEMP "pp.txt"
          [System.IO.File]::WriteAllText($pf, $env:NDI_PASSPHRASE.Trim())
          $zip = Join-Path $env:RUNNER_TEMP "ndi-sdk.zip"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file $pf `
            --output $zip --decrypt (Join-Path $env:RUNNER_TEMP "ndi-sdk.zip.gpg")
          $code = $LASTEXITCODE
          Remove-Item $pf -Force
          if ($code -ne 0) { throw "Decrypt failed" }

          $sdk = "C:\Program Files\NDI\NDI 6 SDK"
          New-Item -ItemType Directory -Force $sdk | Out-Null
          Expand-Archive -Path $zip -DestinationPath $sdk -Force

          New-Item -ItemType Directory -Force lentera-worship/src-tauri/libs | Out-Null
          Copy-Item "$sdk\Bin\x64\Processing.NDI.Lib.x64.dll" lentera-worship/src-tauri/libs/

          "NDI_SDK_DIR=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: lentera-worship
          tauriScript: cargo tauri
          args: --features ndi --config src-tauri/tauri.ndi.conf.json

      - name: Checksums and create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $paths = @($env:ARTIFACT_PATHS | ConvertFrom-Json | Where-Object { $_ -match '\.(exe|msi)$' })
          if ($paths.Count -eq 0) { throw "No installer artifacts found" }
          $files = foreach ($p in $paths) {
            $dest = Join-Path $env:RUNNER_TEMP ((Split-Path $p -Leaf).Replace(' ', '.'))
            Copy-Item $p $dest
            $dest
          }
          $lines = foreach ($f in $files) {
            "$((Get-FileHash $f -Algorithm SHA256).Hash)  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii

          $rows = Get-Content SHA256SUMS.txt | ForEach-Object {
            $hash, $name = $_ -split '\s+', 2
            '| `' + $name + '` | `' + $hash + '` |'
          }
          $table = "| File | SHA256 |`n|---|---|`n" + ($rows -join "`n")
          $notes = (Get-Content .github/release-notes.md -Raw).Replace('{{VERSION}}', $version).Replace('{{CHECKSUMS}}', $table)
          Set-Content release-notes.md $notes -Encoding utf8

          gh release create $env:TAG `
            --title "Lentera Worship $env:TAG" `
            --notes-file release-notes.md `
            --verify-tag `
            @($files) SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }

